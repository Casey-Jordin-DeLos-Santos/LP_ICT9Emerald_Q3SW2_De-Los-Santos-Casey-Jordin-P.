<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootsrap.min.css">


	<style>


	body{
	background-image:url(calv.jpg);
	display: flex;
    justify-content: center;
    align-items: center;
    height: 100px;
    margin:0;
    background-color: #f4f4f4;
    font-family: Arial, sans-serif;
    margin-top: 290px;

}

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
}

.calculator {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
    text-align: center;

 
 }

 input {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
    text-align: center;
    font-size: 16px;
}

.buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
}

button {
    background: #28a745;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #218838;
}

#Result {
    margin-top: 15px;
    font-size: 18px;
    color: #333;
}

h1{
	text-align: center;
  color: ghostwhite;
}

	</style>
</head>
<body>

	<h1>SIMPLE CALCULATOR</h1>

<div class="container">
<div class="calculator">
<h2>Hi, My name is Lebron James let's test your maths skill!! :)</h2>
<details ontoggle="message()">
<summary>Instruction</summary>	
<i> Enter two numbers then find its answer" </i>
</details>

<form>
  <label>Enter 1st Number</label>	
  <input type="number" id="num 1" placeholder="a"></input>

<br>

<label>Enter 2nd Number</label>	
  <input type="number" id="num 2" placeholder="b"></input>

<br>

<button type="button" onclick="place()">Add</button>
<button type="button" onclick="minus()">Minus</button>
<button type="button" onclick="multiply()">Multiply</button>
<button type="button" onclick="divide()">Divide</button>
<span><h1 id="Result">RESULT</h1>.</span>



</form>

</div>

<script>
function message() {
	alert("try it");
}

function place() {

var add1= document.getElementById ("num 1").value
var add2= document.getElementById ("num 2").value;
var sum = Number(add1) + Number (add2);
document.getElementById('Result').innerHTML= 'Answer is '+ ''+ sum;

}

function minus () {
	var minus1= document.getElementById ("num 1").value
var minus2= document.getElementById ("num 2").value;
var ans = Number(minus1) - Number (minus2);
document.getElementById('Result').innerHTML= 'Answer is '+ ''+ ans;

}

function multiply () {
	var multiply1= document.getElementById ("num 1").value
var multiply2= document.getElementById ("num 2").value;
var ans = Number(multiply1) * Number (multiply2);
document.getElementById('Result').innerHTML= 'Answer is '+ ''+ ans;

}

function divide () {
	var divide1= document.getElementById ("num 1").value
var divide2= document.getElementById ("num 2").value;
var ans = Number(divide1) / Number (divide2);
document.getElementById('Result').innerHTML= 'Answer is '+ ''+ ans;

}

</script>
